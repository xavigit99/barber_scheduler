name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run Gitleaks
        run: ./gitleaks detect --source . --redact --verbose

  trufflehog:
    name: TruffleHog full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        shell: bash
        run: |
          set +e
          docker run --rm -v "${PWD}:/repo" trufflesecurity/trufflehog:latest git file:///repo --results=verified,unknown --json --fail --no-update --exclude-paths .trufflehogignore > trufflehog.jsonl
          status=$?

          if [ -s trufflehog.jsonl ]; then
            count="$(wc -l < trufflehog.jsonl | tr -d ' ')"
            echo "TruffleHog found ${count} result(s). Redacted metadata:"
            python - <<'PY'
          import json
          from pathlib import Path

          for line in Path("trufflehog.jsonl").read_text().splitlines():
              line = line.strip()
              if not line.startswith("{"):
                  continue
              item = json.loads(line)
              git = item.get("SourceMetadata", {}).get("Data", {}).get("Git", {})
              print(
                  "- detector={detector} verified={verified} file={file} line={line_no} commit={commit}".format(
                      detector=item.get("DetectorName"),
                      verified=item.get("Verified"),
                      file=git.get("file"),
                      line_no=git.get("line"),
                      commit=git.get("commit"),
                  )
              )
          PY
          else
            echo "TruffleHog found no verified or unknown secrets."
          fi

          exit "$status"
