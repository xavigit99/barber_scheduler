name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check .

  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Debug imports
        run: |
          python -c "import backend.core; print('core OK')"
          python -c "from backend.core.webhook import Webhook; print('webhook OK')"
          python -c "from backend.application.handlers.webhook.create_webhook_handler import CreateWebhookHandler; print('webhook handler OK')"
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/pytest_output.txt; exit ${PIPESTATUS[0]}

  build-frontend:
    name: Frontend build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend
      - name: TypeScript build
        run: npm run build
        working-directory: frontend
